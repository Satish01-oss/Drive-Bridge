name: Build Android companion preview
on:
  push:
    branches: [main]
    paths: ['android/**','remote/**','scripts/build-remote-client.mjs','.github/workflows/android-app.yml']
  pull_request:
    paths: ['android/**','remote/**','scripts/build-remote-client.mjs','.github/workflows/android-app.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the shared client assets
        run: node scripts/build-remote-client.mjs
      - name: Check native signature contract and build debug test APK
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: DeviceBridge-Android-preview-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
