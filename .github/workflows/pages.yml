name: Verify and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release synchronization
        run: node --test scripts/sync-github-release.test.mjs scripts/sync-android-update.test.mjs
      - name: Build improvements tracker
        run: node scripts/build-improvements.mjs
      - name: Prepare the latest published Windows release
        run: node scripts/sync-github-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check download integrity and website links
        run: node scripts/verify-site.mjs
      - name: Refresh the Android in-app update feed
        run: node scripts/sync-android-update.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check JavaScript syntax
        run: node --check dist/app.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
