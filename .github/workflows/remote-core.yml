name: Test remote connection foundation

on:
  push:
    branches: [main]
    paths:
      - 'remote/**'
      - '.github/workflows/remote-core.yml'
  pull_request:
    paths:
      - 'remote/**'
      - '.github/workflows/remote-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked signaling dependency
        run: npm ci --ignore-scripts --no-fund --no-audit
        working-directory: remote
      - name: Test protocol, recovery, signed pairing and HTTP/WebSocket transport
        run: npm test
        working-directory: remote
