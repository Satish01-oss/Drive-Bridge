services:
  - type: web
    name: devicebridge-signaling-preview
    runtime: node
    plan: free
    rootDir: remote
    buildFilter:
      ignoredPaths:
        - remote/**/*.test.mjs
        - remote/**/*.md
    buildCommand: npm ci --ignore-scripts --no-fund --no-audit && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BIND_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://satish01-oss.github.io,https://appassets.androidplatform.net,https://devicebridge.local
